# dry-run fixture για το {{cell.id}}
channel: email_gr
steps:
  - day: 0
    angle: "ο πόνος"
    subject: "Μια ιδέα για τα ραντεβού (dry-run)"
    variants:
      - when: "signals.has_online_booking == false"
        opener: "Γεια σου! Είδα ότι στο {{business.name}} τα ραντεβού κλείνουν μόνο τηλεφωνικά."
      - when: default
        opener: "Γεια σου! Γράφω σε επιχειρήσεις του κλάδου «{{vertical.name}}» για κάτι που σου γλιτώνει ώρες."
    body: |
      Φτιάξαμε ένα σύντομο demo που δείχνει πώς ένας AI agent απαντά στους πελάτες σου και κλείνει ραντεβού όποια ώρα του γράψουν, ενώ εσύ συνεχίζεις τη δουλειά σου. Είναι demo με φανταστική επιχείρηση και ενδεικτικά δεδομένα, το βλέπεις σε λιγότερο από ένα λεπτό από το κινητό:
      {{demo_url}}
      Αν δεν σου ταιριάζει, κανένα πρόβλημα.
    cta: "Αν θες να δούμε τι θα έκανε στη δική σου επιχείρηση, κλείσε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών: {{booking_url}}"
  - day: 4
    angle: "τι δείχνει το demo"
    subject: "Το demo σε 40 δευτερόλεπτα (dry-run)"
    variants:
      - when: default
        opener: "Γεια σου ξανά, μια σύντομη συνέχεια στο προηγούμενο μήνυμα."
    body: |
      Στο demo βλέπεις και τις δύο πλευρές: τι γράφει ο πελάτης και τι βλέπεις εσύ. Ό,τι χρειάζεται άνθρωπο έρχεται σε σένα, όλα τα υπόλοιπα απαντώνται μόνα τους, από όσα έχεις ορίσει εσύ. Δεν αλλάζεις εργαλεία που ήδη χρησιμοποιείς:
      {{demo_url}}
    cta: "Αν σε ενδιαφέρει, κλείσε τον Χάρτη AI και το συζητάμε για τη δική σου περίπτωση: {{booking_url}}"
  - day: 10
    angle: "τελευταίο μήνυμα"
    subject: "Κλείνω εδώ (dry-run)"
    variants:
      - when: default
        opener: "Γεια σου, αυτό είναι το τελευταίο μου μήνυμα για αυτό το θέμα."
    body: |
      Αν κάποια στιγμή θες να δεις αν αξίζει ένας agent για τα μηνύματα και τα ραντεβού σου, ξεκινάμε πάντα από ένα πράγμα, με pilot λίγων εβδομάδων και ένα KPI που συμφωνούμε από πριν. Το demo μένει εδώ:
      {{demo_url}}
    cta: "Όποτε θες, ο Χάρτης AI είναι μια δωρεάν κλήση 30 λεπτών: {{booking_url}}"
