channel: phone_b2b
opening:
  - when: "signals.has_online_booking == false"
    opener: "Καλησπέρα, είμαι από την Auragram. Είδα ότι στο {{business.name}} τα ραντεβού κλείνουν τηλεφωνικά, σας παίρνω για δύο λεπτά, αν μπορείτε."
  - when: default
    opener: "Καλησπέρα, είμαι από την Auragram. Σας παίρνω για δύο λεπτά για κάτι που γλιτώνει ώρες σε επιχειρήσεις σαν τη δική σας, αν μπορείτε."
questions:
  - "Πώς κλείνετε σήμερα τα ραντεβού;"
  - "Πόσο συχνά χάνετε κλήσεις όταν είστε απασχολημένοι;"
objections:
  - objection: "Δεν έχω χρόνο"
    answer: "Γι' αυτό ακριβώς σας παίρνω. Σας στέλνω ένα demo ενός λεπτού και το βλέπετε όποτε θέλετε."
  - objection: "Είναι ακριβό"
    answer: "Ξεκινάμε με μια δωρεάν κλήση, τον Χάρτη AI. Αν δεν αξίζει, θα σας το πούμε."
close: "Να σας στείλω το demo και, αν σας ενδιαφέρει, να κλείσουμε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών;"
