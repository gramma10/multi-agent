# Outreach: Ιατρεία × Support Agent. 3 αγγίγματα σε 10 ημέρες.
channel: email_gr
steps:
  - day: 0
    angle: "η γραμματεία στο τηλέφωνο"
    subject: "Οι ίδιες ερωτήσεις, όλη μέρα"
    variants:
      - when: "signals.has_viber == true"
        opener: "Γεια σου! Είδα ότι το {{business.name}} δέχεται μηνύματα και στο Viber."
      - when: default
        opener: "Γεια σου! Σου γράφω για τις ερωτήσεις που φτάνουν κάθε μέρα στη γραμματεία ενός ιατρείου."
    body: |
      Ωράριο, ΕΟΠΥΥ, ελεύθερα ραντεβού, τι να φέρει ο ασθενής: απαντήσεις που δίνονται ξανά και ξανά. Φτιάξαμε ένα demo όπου το Viber του ιατρείου απαντά μόνο του σε αυτά, μόνο από όσα έχει ορίσει το ιατρείο. Ό,τι είναι ιατρικό δεν το απαντά ποτέ: πάει αμέσως στη γραμματεία. Είναι demo με φανταστικό ιατρείο:
      {{demo_url}}
    cta: "Αν θες να δούμε τι θα είχε νόημα για το δικό σου ιατρείο, κλείσε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών: {{booking_url}}"
  - day: 4
    angle: "τι γίνεται με το επείγον"
    subject: "Κι αν ένας ασθενής γράψει κάτι σοβαρό;"
    variants:
      - when: default
        opener: "Γεια σου ξανά. Είναι η πρώτη ερώτηση που μας κάνει κάθε γιατρός, οπότε σου γράφω την απάντηση."
    body: |
      Ο βοηθός δεν κάνει διάγνωση και δεν δίνει ιατρικές συμβουλές. Αν ένα μήνυμα ακούγεται σοβαρό, δίνει 166 και 112 και ειδοποιεί αμέσως τη γραμματεία με σημαία, ώστε να μη χαθεί ανάμεσα στα υπόλοιπα. Δες το στο demo, στο «πόνο στο στήθος»:
      {{demo_url}}
    cta: "Αν σε ενδιαφέρει, το συζητάμε στον Χάρτη AI: {{booking_url}}"
  - day: 10
    angle: "τελευταίο"
    subject: "Κλείνω εδώ"
    variants:
      - when: default
        opener: "Γεια σου, αυτό είναι το τελευταίο μου μήνυμα για αυτό."
    body: |
      Αν κάποια στιγμή θες να ελαφρύνει η γραμματεία χωρίς να χάσεις τον έλεγχο του προγράμματος, ξεκινάμε από ένα pilot λίγων εβδομάδων με ένα νούμερο που συμφωνούμε από πριν, όπως πόσα μηνύματα απαντήθηκαν χωρίς τη γραμματεία. Το demo μένει εδώ:
      {{demo_url}}
    cta: "Όποτε θες, κλείσε τον Χάρτη AI: {{booking_url}}"
