channel: phone_b2b
opening:
  - when: default
    opener: "Καλησπέρα, σας παίρνω από την Auragram για κάτι σύντομο που αφορά τη γραμματεία του ιατρείου. Έχετε δύο λεπτά ή να σας πάρω άλλη ώρα;"
questions:
  - "Από πού έρχονται οι περισσότερες ερωτήσεις των ασθενών: τηλέφωνο, Viber, email;"
  - "Ποιες ερωτήσεις επαναλαμβάνονται πιο συχνά;"
  - "Τι γίνεται με τα μηνύματα που έρχονται μετά το κλείσιμο;"
objections:
  - objection: "Δεν θέλω το AI να μιλάει με ασθενείς"
    answer: "Σωστό να ανησυχείτε. Απαντά μόνο διοικητικά, από όσα ορίζει το ιατρείο. Οτιδήποτε ιατρικό πάει σε άνθρωπο, και το επείγον πρώτο."
  - objection: "Τα δεδομένα των ασθενών;"
    answer: "Δεν κρατάμε ιατρικό ιστορικό. Αυτό το στήνουμε από την αρχή και το βλέπετε στον Χάρτη AI."
  - objection: "Δεν έχω χρόνο"
    answer: "Να σας στείλω ένα demo 45 δευτερολέπτων στο Viber και το βλέπετε όποτε θέλετε;"
close: "Να σας στείλω το demo και, αν σας ενδιαφέρει, να κλείσουμε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών;"
