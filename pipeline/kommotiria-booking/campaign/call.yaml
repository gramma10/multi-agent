channel: phone_b2b
opening:
  - when: "signals.has_online_booking == false"
    opener: "Καλησπέρα, σας παίρνω από την Auragram. Είδα ότι στο {{business.name}} τα ραντεβού κλείνουν τηλεφωνικά. Έχετε δύο λεπτά ή να σας πάρω άλλη ώρα;"
  - when: default
    opener: "Καλησπέρα, σας παίρνω από την Auragram για κάτι σύντομο σχετικά με τα ραντεβού του κομμωτηρίου. Έχετε δύο λεπτά ή να σας πάρω άλλη ώρα;"
questions:
  - "Πώς κλείνετε σήμερα τα ραντεβού: τηλέφωνο, Instagram, κάποιο πρόγραμμα;"
  - "Σας συμβαίνει να μην έρχεται κάποιος χωρίς να ειδοποιήσει;"
  - "Ποιος σηκώνει το τηλέφωνο όταν όλοι έχετε πελάτη;"
objections:
  - objection: "Δεν έχω χρόνο τώρα"
    answer: "Κανένα πρόβλημα. Να σας στείλω ένα demo 40 δευτερολέπτων στο Viber και το βλέπετε όποτε θέλετε;"
  - objection: "Έχω ήδη πρόγραμμα κρατήσεων"
    answer: "Ωραία, δεν σας ζητάμε να το αλλάξετε. Συνήθως αυτό που λείπει είναι η υπενθύμιση στο Viber και η λίστα αναμονής για τις ακυρώσεις."
  - objection: "Πόσο κοστίζει;"
    answer: "Ξεκινάμε από μια δωρεάν κλήση 30 λεπτών, τον Χάρτη AI. Αν δεν αξίζει για εσάς, θα σας το πούμε εκεί."
close: "Να σας στείλω το demo και, αν σας ενδιαφέρει, να κλείσουμε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών;"
