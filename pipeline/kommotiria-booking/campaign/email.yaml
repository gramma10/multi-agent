# Outreach: Κομμωτήρια × Σύστημα κρατήσεων. 3 αγγίγματα σε 10 ημέρες.
# Τα {{sender_block}} και {{unsubscribe}} τα προσθέτει ο κώδικας.
channel: email_gr
steps:
  - day: 0
    angle: "το τηλέφωνο την ώρα που κόβεις"
    subject: "Τα ραντεβού στο κομμωτήριο, χωρίς τηλέφωνα"
    variants:
      - when: "signals.has_online_booking == false"
        opener: "Γεια σου! Είδα ότι στο {{business.name}} τα ραντεβού κλείνουν από το τηλέφωνο."
      - when: default
        opener: "Γεια σου! Σου γράφω γιατί στα περισσότερα κομμωτήρια τα ραντεβού κλείνουν ακόμα από το τηλέφωνο, την ώρα που κόβεις."
    body: |
      Φτιάξαμε ένα demo για να δείξουμε πώς θα ήταν αλλιώς: ο πελάτης κλείνει μόνος του από ένα link, βλέποντας μόνο τις ελεύθερες ώρες, και το ραντεβού μπαίνει κατευθείαν στο πρόγραμμα. Εσύ δεν σηκώνεις τηλέφωνο. Είναι demo με φανταστικό κομμωτήριο, το δοκιμάζεις σε 40 δευτερόλεπτα από το κινητό:
      {{demo_url}}
    cta: "Αν θες να δούμε αν αξίζει για το δικό σου κομμωτήριο, κλείσε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών: {{booking_url}}"
  - day: 4
    angle: "αυτοί που ξεχνάνε"
    subject: "Η ώρα που έμεινε άδεια"
    variants:
      - when: default
        opener: "Γεια σου ξανά, μια σκέψη ακόμα για τα ραντεβού."
    body: |
      Ο κόσμος δεν είναι κακός, απλά ξεχνάει. Στο demo, την προηγούμενη μέρα ο πελάτης παίρνει υπενθύμιση στο Viber με δύο κουμπιά: «Θα έρθω» ή «Θέλω αλλαγή». Αν ακυρώσει, η ώρα πάει στον πρώτο της λίστας αναμονής, χωρίς να κάνεις τίποτα εσύ:
      {{demo_url}}
    cta: "Αν σε ενδιαφέρει, ο Χάρτης AI είναι 30 λεπτά: βλέπουμε μαζί πού χάνεις ραντεβού σήμερα. {{booking_url}}"
  - day: 10
    angle: "τελευταίο, χωρίς πίεση"
    subject: "Κλείνω εδώ"
    variants:
      - when: default
        opener: "Γεια σου, αυτό είναι το τελευταίο μου μήνυμα για αυτό."
    body: |
      Αν κάποια στιγμή θες να γλιτώσεις τα τηλέφωνα την ώρα της δουλειάς, ξεκινάμε από ένα πράγμα: ένα pilot λίγων εβδομάδων στο δικό σου κομμωτήριο, με ένα νούμερο που συμφωνούμε από πριν, όπως πόσα ραντεβού χάνονται την εβδομάδα. Το demo μένει εδώ:
      {{demo_url}}
    cta: "Όποτε θες, κλείσε τον Χάρτη AI: {{booking_url}}"
