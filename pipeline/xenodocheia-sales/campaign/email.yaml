# Outreach: Ξενοδοχεία × Sales Agent. 3 αγγίγματα σε 10 ημέρες. Καλύτερα πριν τη σεζόν (Μάρτιος–Μάιος).
channel: email_gr
steps:
  - day: 0
    angle: "το ερώτημα που περιμένει"
    subject: "Το ερώτημα για δωμάτιο που ήρθε στις 11 το βράδυ"
    variants:
      - when: "business.reviews_count >= 100"
        opener: "Γεια σου! Το {{business.name}} έχει πολλές κριτικές, άρα και πολλά ερωτήματα για δωμάτια."
      - when: default
        opener: "Γεια σου! Σου γράφω για τα ερωτήματα κράτησης που φτάνουν όταν είσαι στη reception ή έχεις κλείσει για τη μέρα."
    body: |
      Ο επισκέπτης στέλνει συνήθως το ίδιο ερώτημα και σε άλλα καταλύματα, και όποιος απαντήσει πρώτος και σωστά έχει το πλεονέκτημα. Φτιάξαμε ένα demo όπου ο agent απαντά σε δευτερόλεπτα, στη γλώσσα του επισκέπτη, με διαθέσιμα δωμάτια και link για απευθείας κράτηση. Είναι demo με φανταστικό ξενοδοχείο:
      {{demo_url}}
    cta: "Αν θες να το δούμε για το δικό σου κατάλυμα πριν τη σεζόν, κλείσε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών: {{booking_url}}"
  - day: 4
    angle: "οι γλώσσες"
    subject: "Στα γερμανικά, χωρίς να γράψεις εσύ γερμανικά"
    variants:
      - when: default
        opener: "Γεια σου ξανά, μια συνέχεια στο προηγούμενο μήνυμα."
    body: |
      Στο demo διαλέγεις γλώσσα (αγγλικά, γερμανικά, ιταλικά, ελληνικά) και βλέπεις την απάντηση να έρχεται στη σωστή γλώσσα, με τις δικές σου τιμές και πολιτικές. Εσύ βλέπεις κάθε lead στα ελληνικά και μπαίνεις μόνο όταν χρειάζεται:
      {{demo_url}}
    cta: "Αν σε ενδιαφέρει, το συζητάμε στον Χάρτη AI: {{booking_url}}"
  - day: 10
    angle: "τελευταίο"
    subject: "Κλείνω εδώ"
    variants:
      - when: default
        opener: "Γεια σου, αυτό είναι το τελευταίο μου μήνυμα για αυτό."
    body: |
      Αν κάποια στιγμή θες περισσότερες απευθείας κρατήσεις από όσους σου γράφουν ήδη, ξεκινάμε από ένα pilot λίγων εβδομάδων στη σεζόν, με ένα νούμερο που συμφωνούμε από πριν: πόσες απευθείας κρατήσεις έρχονται από ερωτήματα. Το demo μένει εδώ:
      {{demo_url}}
    cta: "Όποτε θες, κλείσε τον Χάρτη AI: {{booking_url}}"
