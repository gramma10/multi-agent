channel: phone_b2b
opening:
  - when: default
    opener: "Καλησπέρα, σας παίρνω από την Auragram για κάτι σύντομο που αφορά τα ερωτήματα κράτησης. Έχετε δύο λεπτά ή να σας πάρω άλλη ώρα;"
questions:
  - "Από πού σας έρχονται τα ερωτήματα για δωμάτια: email, site, Instagram, Viber;"
  - "Ποιος τα απαντά στη σεζόν, και πόσο γρήγορα προλαβαίνει;"
  - "Σε τι γλώσσες γράφουν οι περισσότεροι επισκέπτες σας;"
objections:
  - objection: "Τα παίρνω όλα από το Booking"
    answer: "Δεν σας λέμε να φύγετε από τις πλατφόρμες. Ο στόχος είναι να μη χάνετε όσους σας ρωτάνε ήδη απευθείας."
  - objection: "Θα δίνει λάθος τιμές"
    answer: "Δουλεύει μόνο με τις τιμές και τις πολιτικές που ορίζετε εσείς, και δεν δίνει εκπτώσεις που δεν έχετε αποφασίσει."
  - objection: "Είναι νωρίς, η σεζόν είναι μακριά"
    answer: "Γι' αυτό ακριβώς: στήνεται και δοκιμάζεται πριν έρθει ο φόρτος. Να σας στείλω το demo;"
close: "Να σας στείλω το demo και, αν σας ενδιαφέρει, να κλείσουμε τον Χάρτη AI, μια δωρεάν κλήση 30 λεπτών;"
