  - { id: kataskeves, name: "Κατασκευαστικές και τεχνικές εταιρείες", kad: [ "41.20", "43.21", "43.22", "43.3", "71.12" ], places: [ "κατασκευαστική εταιρεία", "ανακαινίσεις", "ηλεκτρολόγος εγκαταστάτης", "υδραυλικός" ] }
  - { id: gymnastiria, name: "Γυμναστήρια και studios", kad: [ "93.13", "85.51" ], places: [ "γυμναστήριο", "pilates studio", "yoga studio" ] }
