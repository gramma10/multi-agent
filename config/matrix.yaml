# Πίνακας εργασιών: κλάδος × υπηρεσία
#
# Ο orchestrator διαλέγει πρώτα κελιά με fit: high και μετά με σειρά priority (μεγαλύτερο πρώτα).
# priority: 0–100. Την αλλάζει ο tracker (βρόχος μάθησης) και ο άνθρωπος.
# status: καθρέφτης του pipeline/<id>/task.yaml. Τον ενημερώνει ο orchestrator. Η αλήθεια είναι στο task.yaml.
#
# ΝΕΟΣ ΚΛΑΔΟΣ = μία γραμμή στο verticals. Τα κελιά του δημιουργούνται αυτόματα
# (fit: medium, priority: 40) μέχρι να γράψεις δικά σου παρακάτω.
#
# kad: προθέματα ΚΑΔ για τον adapter ΓΕΜΗ (υπόθεση με βάση NACE Rev.2, να επαληθευτούν).
# places: text queries για το Google Places API (επίσημο API, όχι scraping).

verticals:
  - { id: kommotiria, name: "Κομμωτήρια και κουρεία", kad: [ "96.02" ], places: [ "κομμωτήριο", "κουρείο", "barber shop" ] }
  - { id: xenodocheia, name: "Ξενοδοχεία και ενοικιαζόμενα", kad: [ "55.10", "55.20" ], places: [ "ξενοδοχείο", "ενοικιαζόμενα δωμάτια", "boutique hotel" ] }
  - { id: iatreia, name: "Ιατρεία και οδοντιατρεία", kad: [ "86.21", "86.22", "86.23" ], places: [ "ιατρείο", "οδοντίατρος", "οδοντιατρείο" ] }
